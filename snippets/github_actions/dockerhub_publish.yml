name: Publish Docker Hub Images

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: kesler20
  BASE_IMAGE_NAME: wiz_app_cepi_base
  BACKEND_IMAGE_NAME: wiz_app_cepi_backend
  FRONTEND_IMAGE_NAME: wiz_app_cepi_frontend

jobs:
  frontend_checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend type check
        run: pnpm run type-check

      - name: Build frontend
        run: pnpm run build

  publish_images:
    runs-on: ubuntu-latest
    needs: frontend_checks
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata for base image
        id: base_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}:buildcache,mode=max

      - name: Extract Docker metadata for backend image
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          build-args: |
            BASE_IMAGE=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}:latest
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}:buildcache,mode=max

      - name: Extract Docker metadata for frontend image
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:buildcache,mode=max

      - name: Add Docker Hub links to summary
        run: |
          {
            echo "## Docker Hub Images"
            echo ""
            echo "- Base: https://hub.docker.com/r/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BASE_IMAGE_NAME }}"
            echo "- Backend: https://hub.docker.com/r/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}"
            echo "- Frontend: https://hub.docker.com/r/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}"
          } >> "$GITHUB_STEP_SUMMARY"